[package]
name = "discord_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
