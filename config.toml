# Discord Overlay Proxy configuration
# Copy / edit this file, then: cargo run
# Optional: cargo run -- path/to/other-config.toml

[server]
host = "127.0.0.1"
port = 3000

[streamkit]
# Paste your full Discord Streamkit voice overlay URL here.
# Streamkit → Install for Developer → copy the voice widget link.
url = "https://streamkit.discord.com/overlay/voice?server=YOUR_SERVER_ID&channel=YOUR_CHANNEL_ID"

# Local image folder (served at http://HOST:PORT/assets/...)
[assets]
dir = "assets"

# Map Discord user snowflakes → idle / speaking images.
# Developer Mode → right-click user → Copy User ID.
#
# --- Local files (recommended) ---
# Put PNGs/WebPs in ./assets/ then use just the filename:
#
# [users.123456789012345678]
# idle_url = "alice-idle.png"
# speaking_url = "alice-speaking.png"
#
# Subfolders work too:
# idle_url = "team/alice-idle.png"
# speaking_url = "assets/team/alice-speaking.png"   # "assets/" prefix is optional
#
# --- Remote URLs still work ---
# idle_url = "https://example.com/avatars/alice-idle.png"
# speaking_url = "https://example.com/avatars/alice-speaking.png"

[users.000000000000000000]
idle_url = "example-idle.png"
speaking_url = "example-speaking.png"
